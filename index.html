<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaj Fabrications - Kalikavu | Estimate Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 bg-blue-900 flex justify-center items-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full space-y-4 text-center">
            <h2 class="text-xl font-bold text-blue-900">Thaj Fabrications</h2>
            <p class="text-sm text-gray-600">Dayavayi password nalkuka</p>
            <input type="password" id="passInput" placeholder="Password (default: 1234)" class="w-full p-2 border rounded-full text-center">
            <button onclick="checkPassword()" class="w-full bg-blue-600 text-white p-2.5 rounded-full font-bold hover:bg-blue-700 shadow-md">Login</button>
        </div>
    </div>

    <!-- Custom Alert / Confirm Modal -->
    <div id="appModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center p-3 z-50">
        <div class="bg-white rounded-2xl p-5 max-w-sm w-full text-center space-y-4 shadow-xl">
            <p id="appModalText" class="text-gray-800 font-medium"></p>
            <div id="appModalButtons" class="flex justify-center gap-2"></div>
        </div>
    </div>

    <div class="container mx-auto p-3 max-w-md md:max-w-2xl hidden" id="mainApp">
        <!-- Header -->
        <div class="bg-blue-800 text-white p-4 rounded-2xl shadow-md mb-4 flex flex-col md:flex-row justify-between items-center relative gap-2">
            <div class="text-center md:text-left">
                <h1 class="text-xl md:text-2xl font-bold">Thaj Fabrications, Kalikavu</h1>
                <p class="text-xs md:text-sm mt-0.5">Mob: 9020322647</p>
            </div>
            <button onclick="logout()" class="bg-red-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md hover:bg-red-700">Logout</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex mb-4 bg-white rounded-2xl shadow overflow-hidden text-sm md:text-base p-1 gap-1">
            <button onclick="switchTab('newEstimate')" id="tabNew" class="w-1/3 p-2.5 font-bold bg-blue-600 text-white text-center rounded-xl shadow">Estimate</button>
            <button onclick="switchTab('manageProducts')" id="tabProd" class="w-1/3 p-2.5 font-bold bg-gray-100 text-gray-700 text-center rounded-xl">Products</button>
            <button onclick="switchTab('accounts')" id="tabAcc" class="w-1/3 p-2.5 font-bold bg-gray-100 text-gray-700 text-center rounded-xl">Accounts</button>
        </div>

        <!-- Section 1: New Estimate -->
        <div id="sectionNew" class="space-y-4">
            <div id="stepCustomer" class="bg-white p-4 md:p-6 rounded-2xl shadow-md">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">Customer Details</h2>
                <div class="grid grid-cols-1 gap-3 text-sm md:text-base">
                    <div>
                        <label class="block text-gray-600">Name:</label>
                        <input type="text" id="custName" class="w-full p-2.5 border rounded-xl" placeholder="Customer's name">
                    </div>
                    <div>
                        <label class="block text-gray-600">House Name:</label>
                        <input type="text" id="houseName" class="w-full p-2.5 border rounded-xl" placeholder="House name">
                    </div>
                    <div>
                        <label class="block text-gray-600">Phone / WhatsApp No:</label>
                        <input type="tel" id="custPhone" class="w-full p-2.5 border rounded-xl" placeholder="10 digit number">
                    </div>
                    <div>
                        <label class="block text-gray-600">Location:</label>
                        <input type="text" id="custLocation" class="w-full p-2.5 border rounded-xl" placeholder="Location">
                    </div>
                    <div>
                        <label class="block text-gray-600">Care Of (C/O):</label>
                        <input type="text" id="custCof" class="w-full p-2.5 border rounded-xl" placeholder="C/O if any">
                    </div>
                </div>
                <button onclick="proceedToProducts()" class="mt-4 w-full bg-blue-600 text-white p-3 rounded-full font-bold text-sm shadow-md hover:bg-blue-700">Next: Add Products</button>
            </div>

            <div id="stepProducts" class="bg-white p-4 md:p-6 rounded-2xl shadow-md hidden space-y-4">
                <div class="bg-blue-50 p-3 rounded-xl border flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-500">Customer:</p>
                        <p id="savedCustDisplay" class="font-bold text-blue-900"></p>
                    </div>
                    <button onclick="editCustomerDetails()" class="bg-yellow-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow">Edit Details</button>
                </div>

                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-gray-700">Products Selection</h2>
                    <button onclick="addItemRow()" class="bg-indigo-600 text-white px-3.5 py-1.5 rounded-full text-xs md:text-sm font-bold shadow">+ Add Item</button>
                </div>
                
                <div id="itemsContainer" class="space-y-3">
                    <div class="item-row grid grid-cols-12 gap-1 md:gap-2 items-center border-b pb-3">
                        <select class="item-name col-span-5 p-2.5 border rounded-xl bg-white text-xs md:text-sm"></select>
                        <input type="number" placeholder="Qty" class="item-qty col-span-2 p-2.5 border rounded-xl text-center text-xs md:text-sm" oninput="calculateTotal()">
                        <input type="number" placeholder="Price" class="item-price col-span-4 p-2.5 border rounded-xl text-center text-xs md:text-sm" oninput="calculateTotal()">
                        <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
                    </div>
                </div>

                <div class="mt-4 p-4 bg-gray-50 rounded-xl border text-sm md:text-base space-y-2">
                    <div class="flex justify-between font-bold">
                        <span>Grand Total:</span>
                        <span id="grandTotal">₹ 0</span>
                    </div>
                    <div>
                        <label class="block text-gray-600">Advance Amount:</label>
                        <input type="number" id="advanceAmt" placeholder="₹" class="w-full p-2.5 border rounded-xl text-sm md:text-base" oninput="calculateTotal()">
                    </div>
                    <div class="flex justify-between font-semibold text-red-600 pt-1">
                        <span>Balance Amount:</span>
                        <span id="balanceAmt">₹ 0</span>
                    </div>
                </div>

                <button onclick="saveAndSendWhatsApp()" class="w-full bg-green-600 text-white p-3.5 rounded-full font-bold shadow-md hover:bg-green-700 text-center text-sm md:text-base">
                    Save & Send WhatsApp Bill
                </button>
            </div>
        </div>

        <!-- Section 2: Manage Products Menu -->
        <div id="sectionProducts" class="bg-white p-4 md:p-6 rounded-2xl shadow-md hidden space-y-4 text-sm md:text-base">
            <h2 class="text-lg font-semibold text-gray-700">Manage Products Menu</h2>
            <div class="flex gap-2">
                <input type="text" id="newProductName" placeholder="Enter product name" class="w-full p-2.5 border rounded-xl">
                <button onclick="addNewProduct()" class="bg-blue-600 text-white px-5 py-2.5 rounded-full font-bold shadow">Add</button>
            </div>
            <h3 class="font-medium text-gray-600 mt-3">Current Products List:</h3>
            <div id="productsListUI" class="space-y-2"></div>
        </div>

        <!-- Section 3: Accounts / Search History -->
        <div id="sectionAcc" class="bg-white p-4 md:p-6 rounded-2xl shadow-md hidden space-y-4 text-sm md:text-base">
            <h2 class="text-lg font-semibold text-gray-700">Search Customer Accounts</h2>
            <div class="flex gap-2">
                <input type="text" id="searchQuery" placeholder="Enter name or phone" class="w-full p-2.5 border rounded-xl">
                <button onclick="searchAccounts()" class="bg-blue-600 text-white px-5 py-2.5 rounded-full font-bold shadow">Search</button>
            </div>
            <div id="searchResults" class="space-y-3"></div>
        </div>

        <!-- Detailed Customer View Modal -->
        <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-3 z-40">
            <div class="bg-white rounded-2xl p-4 md:p-6 max-w-lg w-full max-h-screen overflow-y-auto space-y-3 shadow-2xl" id="modalContent"></div>
        </div>
    </div>

    <!-- Firebase SDKs and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBqTWN4ZtGgn0NW5MJiRxHFSL05gIPIgy4",
            authDomain: "thajfabrications.firebaseapp.com",
            projectId: "thajfabrications",
            storageBucket: "thajfabrications.firebasestorage.app",
            messagingSenderId: "660437727559",
            appId: "1:660437727559:web:e524fc879356e771fbf462",
            measurementId: "G-SS0Y0WTRZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let defaultProducts = ["Door (വാതിൽ)", "Window (ജനൽ)", "Almarah (അലമാര)", "Gate (ഗേറ്റ്)", "Grill (ഗ്രിൽ)"];

        function showAppAlert(message, callback) {
            let modal = document.getElementById('appModal');
            let textElem = document.getElementById('appModalText');
            let btnDiv = document.getElementById('appModalButtons');
            textElem.innerText = message;
            btnDiv.innerHTML = `<button onclick="document.getElementById('appModal').classList.add('hidden'); ${callback ? callback + '()' : ''}" class="bg-blue-600 text-white px-5 py-2 rounded-full font-bold text-sm shadow">OK</button>`;
            modal.classList.remove('hidden');
        }

        window.showAppConfirm = function(message, onYes) {
            let modal = document.getElementById('appModal');
            let textElem = document.getElementById('appModalText');
            let btnDiv = document.getElementById('appModalButtons');
            textElem.innerText = message;
            btnDiv.innerHTML = `
                <button id="confirmYes" class="bg-red-600 text-white px-5 py-2 rounded-full font-bold text-sm shadow">Yes</button>
                <button onclick="document.getElementById('appModal').classList.add('hidden')" class="bg-gray-400 text-white px-5 py-2 rounded-full font-bold text-sm shadow">Cancel</button>
            `;
            modal.classList.remove('hidden');
            document.getElementById('confirmYes').onclick = function() {
                modal.classList.add('hidden');
                onYes();
            };
        }

        window.checkPassword = function() {
            let pass = document.getElementById('passInput').value;
            if(pass === "1234") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadProductsIntoSelects();
            } else {
                showAppAlert("Tettaya password!");
            }
        }

        window.logout = function() {
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('passInput').value = "";
        }

        window.proceedToProducts = function() {
            let name = document.getElementById('custName').value.trim();
            let phone = document.getElementById('custPhone').value.trim();
            if(!name || !phone) {
                showAppAlert("Please enter customer name and phone number!");
                return;
            }
            let house = document.getElementById('houseName').value.trim();
            document.getElementById('savedCustDisplay').innerText = `${name} ${house ? '('+house+')' : ''} - ${phone}`;
            document.getElementById('stepCustomer').classList.add('hidden');
            document.getElementById('stepProducts').classList.remove('hidden');
        }

        window.editCustomerDetails = function() {
            document.getElementById('stepProducts').classList.add('hidden');
            document.getElementById('stepCustomer').classList.remove('hidden');
        }

        function loadProductsIntoSelects() {
            let selects = document.querySelectorAll('.item-name');
            selects.forEach(select => {
                let currentVal = select.value;
                select.innerHTML = "";
                defaultProducts.forEach(prod => {
                    let opt = document.createElement('option');
                    opt.value = prod;
                    opt.textContent = prod;
                    select.appendChild(opt);
                });
                if(currentVal) select.value = currentVal;
            });
        }

        window.loadProductManagementList = function() {
            let div = document.getElementById('productsListUI');
            div.innerHTML = "";
            defaultProducts.forEach((prod, index) => {
                let itemDiv = document.createElement('div');
                itemDiv.className = "flex justify-between items-center bg-gray-50 p-3 rounded-xl border";
                itemDiv.innerHTML = `
                    <span class="font-medium">${prod}</span>
                    <div class="space-x-2">
                        <button onclick="editProduct(${index})" class="bg-yellow-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow">Edit</button>
                        <button onclick="deleteProduct(${index})" class="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow">Delete</button>
                    </div>
                `;
                div.appendChild(itemDiv);
            });
        }

        window.addNewProduct = function() {
            let prodName = document.getElementById('newProductName').value.trim();
            if(prodName) {
                if(!defaultProducts.includes(prodName)) {
                    defaultProducts.push(prodName);
                    document.getElementById('newProductName').value = "";
                    loadProductsIntoSelects();
                    loadProductManagementList();
                    showAppAlert("Product added successfully!");
                } else {
                    showAppAlert("Product already exists.");
                }
            } else {
                showAppAlert("Please enter a valid product name.");
            }
        }

        window.editProduct = function(index) {
            let oldName = defaultProducts[index];
            let newName = prompt("Enter new product name:", oldName);
            if(newName && newName.trim() !== "") {
                defaultProducts[index] = newName.trim();
                loadProductsIntoSelects();
                loadProductManagementList();
                showAppAlert("Product updated successfully!");
            }
        }

        window.deleteProduct = function(index) {
            showAppConfirm("Are you sure you want to delete this product?", function() {
                defaultProducts.splice(index, 1);
                loadProductsIntoSelects();
                loadProductManagementList();
                showAppAlert("Product deleted successfully!");
            });
        }

        window.switchTab = function(tab) {
            document.getElementById('sectionNew').classList.add('hidden');
            document.getElementById('sectionProducts').classList.add('hidden');
            document.getElementById('sectionAcc').classList.add('hidden');

            document.getElementById('tabNew').className = "w-1/3 p-2.5 font-bold bg-gray-100 text-gray-700 text-center rounded-xl";
            document.getElementById('tabProd').className = "w-1/3 p-2.5 font-bold bg-gray-100 text-gray-700 text-center rounded-xl";
            document.getElementById('tabAcc').className = "w-1/3 p-2.5 font-bold bg-gray-100 text-gray-700 text-center rounded-xl";

            if(tab === 'newEstimate') {
                document.getElementById('sectionNew').classList.remove('hidden');
                document.getElementById('tabNew').className = "w-1/3 p-2.5 font-bold bg-blue-600 text-white text-center rounded-xl shadow";
            } else if(tab === 'manageProducts') {
                document.getElementById('sectionProducts').classList.remove('hidden');
                document.getElementById('tabProd').className = "w-1/3 p-2.5 font-bold bg-blue-600 text-white text-center rounded-xl shadow";
                loadProductManagementList();
            } else {
                document.getElementById('sectionAcc').classList.remove('hidden');
                document.getElementById('tabAcc').className = "w-1/3 p-2.5 font-bold bg-blue-600 text-white text-center rounded-xl shadow";
            }
        }

        window.addItemRow = function() {
            let container = document.getElementById('itemsContainer');
            let row = document.createElement('div');
            row.className = "item-row grid grid-cols-12 gap-1 md:gap-2 items-center border-b pb-3";
            row.innerHTML = `
                <select class="item-name col-span-5 p-2.5 border rounded-xl bg-white text-xs md:text-sm"></select>
                <input type="number" placeholder="Qty" class="item-qty col-span-2 p-2.5 border rounded-xl text-center text-xs md:text-sm" oninput="calculateTotal()">
                <input type="number" placeholder="Price" class="item-price col-span-4 p-2.5 border rounded-xl text-center text-xs md:text-sm" oninput="calculateTotal()">
                <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
            `;
            container.appendChild(row);
            loadProductsIntoSelects();
        }

        window.calculateTotal = function() {
            let rows = document.querySelectorAll('.item-row');
            let grandTotal = 0;
            rows.forEach(row => {
                let qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                let price = parseFloat(row.querySelector('.item-price').value) || 0;
                grandTotal += (qty * price);
            });

            document.getElementById('grandTotal').innerText = '₹ ' + grandTotal;
            let advance = parseFloat(document.getElementById('advanceAmt').value) || 0;
            let balance = grandTotal - advance;
            document.getElementById('balanceAmt').innerText = '₹ ' + balance;
        }

        window.saveAndSendWhatsApp = async function() {
            let name = document.getElementById('custName').value;
            let house = document.getElementById('houseName').value;
            let phone = document.getElementById('custPhone').value;
            let location = document.getElementById('custLocation').value;
            let cof = document.getElementById('custCof').value;
            
            let total = document.getElementById('grandTotal').innerText;
            let advance = parseFloat(document.getElementById('advanceAmt').value) || 0;
            let balanceVal = parseFloat(document.getElementById('balanceAmt').innerText.replace('₹', '')) || 0;

            let itemsList = [];
            let rows = document.querySelectorAll('.item-row');
            rows.forEach(row => {
                let itemName = row.querySelector('.item-name').value;
                let qty = row.querySelector('.item-qty').value || 0;
                let price = row.querySelector('.item-price').value || 0;
                
                if(qty > 0) {
                    itemsList.push({ name: itemName, qty: qty, price: price });
                }
            });

            if(itemsList.length === 0) {
                showAppAlert("Please add at least one item!");
                return;
            }

            let dateStr = new Date().toLocaleString();

            try {
                await addDoc(collection(db, "estimates"), {
                    customerName: name,
                    houseName: house,
                    phone: phone,
                    location: location,
                    careOf: cof,
                    items: itemsList,
                    totalAmount: total,
                    advanceAmount: advance,
                    balanceAmount: balanceVal,
                    date: dateStr,
                    additionalPayments: []
                });
            } catch (e) {
                console.error("Firebase Error: ", e);
                showAppAlert("Error saving data.");
                return;
            }

            let msg = `*Thaj Fabrications, Kalikavu*\n`;
            msg += `*Mob: 9020322647*\n\n`;
            msg += `Customer: ${name} (${house})\n`;
            msg += `Location: ${location}\n\n`;
            msg += `*Bill / Estimate Details:*\n`;
            
            itemsList.forEach(item => {
                msg += `- ${item.name}: ${item.qty} Nos (Price: ₹${item.price} each)\n`;
            });

            msg += `\nTotal Amount: ${total}\n`;
            msg += `Advance Paid: ₹ ${advance}\n`;
            msg += `Balance Amount: ₹ ${balanceVal}\n\nThank you!`;
            
            let encodedMsg = encodeURIComponent(msg);
            window.open(`https://wa.me/91${phone}?text=${encodedMsg}`, '_blank');
        }

        window.searchAccounts = async function() {
            let queryText = document.getElementById('searchQuery').value.trim();
            let resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "Searching...";

            if(!queryText) {
                resultsDiv.innerHTML = "Please enter name or phone number.";
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "estimates"));
                let found = false;
                resultsDiv.innerHTML = "";

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    data.id = docSnap.id;
                    if(data.customerName.toLowerCase().includes(queryText.toLowerCase()) || data.phone.includes(queryText)) {
                        found = true;
                        let itemHtml = `<div class="p-3.5 border rounded-2xl bg-gray-50 shadow-sm cursor-pointer hover:bg-blue-50 text-sm" onclick='showCustomerDetail(${JSON.stringify(data)})'>
                            <p><strong>Name:</strong> ${data.customerName} (${data.houseName || ''})</p>
                            <p><strong>Phone:</strong> ${data.phone}</p>
                            <p><strong>Date:</strong> ${data.date || 'N/A'}</p>
                            <p class="text-blue-700 font-semibold mt-1">Total: ${data.totalAmount} | Balance: ₹${data.balanceAmount}</p>
                        </div>`;
                        resultsDiv.innerHTML += itemHtml;
                    }
                });

                if(!found) {
                    resultsDiv.innerHTML = "No records found.";
                }
            } catch (e) {
                console.error("Search error: ", e);
                resultsDiv.innerHTML = "Error during search.";
            }
        }

        window.showCustomerDetail = function(data) {
            let modal = document.getElementById('detailModal');
            let content = document.getElementById('modalContent');
            
            let itemsHtml = "";
            if(data.items) {
                data.items.forEach(it => {
                    itemsHtml += `<li class="flex justify-between border-b py-1 text-sm"><span>${it.name} (${it.qty} Nos x ₹${it.price})</span> <strong>₹${it.qty * it.price}</strong></li>`;
                });
            }

            let addPayHtml = "";
            let totalPaid = parseFloat(data.advanceAmount || 0);
            if(data.additionalPayments) {
                data.additionalPayments.forEach(ap => {
                    totalPaid += parseFloat(ap.amount);
                    addPayHtml += `<li class="flex justify-between text-xs text-green-700 py-1 border-b"><span>Paid on ${ap.date}:</span> <strong>+ ₹${ap.amount}</strong></li>`;
                });
            }

            let totalAmtVal = parseFloat(data.totalAmount.replace(/[^0-9.]/g, '')) || 0;
            let currentBalance = totalAmtVal - totalPaid;

            content.innerHTML = `
                <div id="pdfInvoice" class="p-6 bg-white space-y-3 w-full" style="width: 100%; max-width: 600px; margin: auto; background-color: #ffffff;">
                    <div class="text-center border-b pb-2">
                        <h2 class="text-lg font-bold text-blue-800">Thaj Fabrications, Kalikavu</h2>
                        <p class="text-xs text-gray-500">Mob: 9020322647</p>
                    </div>
                    <div class="text-xs md:text-sm space-y-1">
                        <p><strong>Date:</strong> ${data.date || 'N/A'}</p>
                        <p><strong>Customer:</strong> ${data.customerName} ${data.houseName ? '('+data.houseName+')' : ''}</p>
                        <p><strong>Phone:</strong> ${data.phone}</p>
                        <p><strong>Location:</strong> ${data.location || ''}</p>
                        ${data.careOf ? `<p><strong>C/O:</strong> ${data.careOf}</p>` : ''}
                    </div>
                    <div>
                        <h4 class="font-bold border-b pb-1 text-gray-700 text-sm">Items List:</h4>
                        <ul class="space-y-1">${itemsHtml}</ul>
                    </div>
                    <div>
                        <h4 class="font-bold border-b pb-1 text-gray-700 text-sm">Payments:</h4>
                        <ul class="space-y-1">
                            <li class="flex justify-between text-xs text-gray-600 py-1 border-b"><span>Advance Paid:</span> <strong>₹ ${data.advanceAmount || 0}</strong></li>
                            ${addPayHtml}
                        </ul>
                    </div>
                    <div class="bg-gray-50 p-2 rounded-xl border space-y-1 text-xs md:text-sm">
                        <div class="flex justify-between font-bold"><span>Total:</span> <span>${data.totalAmount}</span></div>
                        <div class="flex justify-between font-semibold text-red-600"><span>Balance Amount:</span> <span>₹ ${currentBalance}</span></div>
                    </div>
                </div>

                <!-- Add More Payment Section -->
                <div class="p-3 bg-gray-100 rounded-xl space-y-2">
                    <label class="block text-xs font-bold text-gray-700">Add New Payment:</label>
                    <div class="flex gap-2">
                        <input type="number" id="addPayInput" placeholder="Amount (₹)" class="w-full p-2.5 border rounded-xl text-sm">
                        <button onclick='recordAdditionalPayment("${data.id}", "${data.phone}", ${currentBalance}, ${totalAmtVal}, ${JSON.stringify(data.additionalPayments || [])})' class="bg-green-600 text-white px-4 py-2.5 rounded-full font-bold text-xs shadow">Add & Send</button>
                    </div>
                </div>

                <!-- Edit and Cancel Buttons -->
                <div class="flex gap-2 pt-2 text-sm">
                    <button onclick='editRecord(${JSON.stringify(data)})' class="w-1/3 bg-yellow-600 text-white py-2.5 rounded-full font-bold shadow">Edit</button>
                    <button onclick='cancelRecord("${data.id}")' class="w-1/3 bg-red-600 text-white py-2.5 rounded-full font-bold shadow">Cancel Bill</button>
                    <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="w-1/3 bg-gray-400 text-white py-2.5 rounded-full font-bold shadow">Close</button>
                </div>
                <div class="pt-2">
                    <button onclick="downloadPDF()" class="w-full bg-blue-600 text-white py-3 rounded-full font-bold shadow-md">Download PDF</button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        window.recordAdditionalPayment = async function(docId, phone, currentBalance, totalAmtVal, existingPayments) {
            let payInput = document.getElementById('addPayInput').value;
            let payAmt = parseFloat(payInput);
            if(!payAmt || payAmt <= 0) {
                showAppAlert("Please enter a valid amount!");
                return;
            }

            let dateStr = new Date().toLocaleDateString();
            existingPayments.push({ amount: payAmt, date: dateStr });

            let newBalance = currentBalance - payAmt;

            try {
                await updateDoc(doc(db, "estimates", docId), {
                    additionalPayments: existingPayments,
                    balanceAmount: newBalance
                });
            } catch(e) {
                console.error("Error updating payment: ", e);
            }

            let msg = `*Thaj Fabrications, Kalikavu*\n`;
            msg += `*Mob: 9020322647*\n\n`;
            msg += `Payment Received: ₹ ${payAmt}\n`;
            msg += `Date: ${dateStr}\n`;
            msg += `Remaining Balance: ₹ ${newBalance}\n\nThank you!`;

            let encodedMsg = encodeURIComponent(msg);
            window.open(`https://wa.me/91${phone}?text=${encodedMsg}`, '_blank');
            document.getElementById('detailModal').classList.add('hidden');
            showAppAlert("Payment recorded successfully!");
        }

        window.editRecord = function(data) {
            document.getElementById('detailModal').classList.add('hidden');
            switchTab('newEstimate');
            document.getElementById('custName').value = data.customerName || '';
            document.getElementById('houseName').value = data.houseName || '';
            document.getElementById('custPhone').value = data.phone || '';
            document.getElementById('custLocation').value = data.location || '';
            document.getElementById('custCof').value = data.careOf || '';
            document.getElementById('advanceAmt').value = data.advanceAmount || '';
            
            document.getElementById('savedCustDisplay').innerText = `${data.customerName} ${data.houseName ? '('+data.houseName+')' : ''} - ${data.phone}`;
            document.getElementById('stepCustomer').classList.add('hidden');
            document.getElementById('stepProducts').classList.remove('hidden');

            let container = document.getElementById('itemsContainer');
            container.innerHTML = "";
            if(data.items) {
                data.items.forEach(it => {
                    let row = document.createElement('div');
                    row.className = "item-row grid grid-cols-12 gap-1 md:gap-2 items-center border-b pb-3";
                    row.innerHTML = `
                        <select class="item-name col-span-5 p-2.5 border rounded-xl bg-white text-xs md:text-sm">
                            <option value="${it.name}" selected>${it.name}</option>
                        </select>
                        <input type="number" value="${it.qty}" placeholder="Qty" class="item-qty col-span-2 p-2.5 border rounded-xl text-center text-xs md:text-sm" oninput="calculateTotal()">
                        <input type="number" value="${it.price}" placeholder="Price" class="item-price col-span-4 p-2.5 border rounded-xl text-center text-xs md:text-sm" oninput="calculateTotal()">
                        <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
                    `;
                    container.appendChild(row);
                });
                loadProductsIntoSelects();
                calculateTotal();
            }
            showAppAlert("Record loaded into form for editing.");
        }

        window.cancelRecord = async function(docId) {
            showAppConfirm("Are you sure you want to cancel this bill?", async function() {
                try {
                    await deleteDoc(doc(db, "estimates", docId));
                    document.getElementById('detailModal').classList.add('hidden');
                    showAppAlert("Bill cancelled successfully.");
                    searchAccounts();
                } catch(e) {
                    console.error("Error deleting document: ", e);
                    showAppAlert("Error cancelling bill.");
                }
            });
        }

        window.downloadPDF = function() {
            let element = document.getElementById('pdfInvoice');
            let opt = {
                margin:       5,
                filename:     'Thaj_Fabrications_Bill.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 3, useCORS: true, logging: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
