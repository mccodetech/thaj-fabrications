<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaj Fabrications - Kalikavu | Estimate Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-2xl">
        <!-- Header -->
        <div class="bg-blue-800 text-white p-6 rounded-lg shadow-md text-center mb-6">
            <h1 class="text-2xl font-bold">താജ് ഫാബ്രിക്കേഷൻസ്, കാളികാവ്</h1>
            <p class="text-sm mt-1">Mob: 9020322647</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex mb-6 bg-white rounded-lg shadow overflow-hidden">
            <button onclick="switchTab('newEstimate')" id="tabNew" class="w-1/2 p-3 font-bold bg-blue-600 text-white text-center">പുതിയ എസ്റ്റിമേറ്റ്</button>
            <button onclick="switchTab('accounts')" id="tabAcc" class="w-1/2 p-3 font-bold bg-gray-200 text-gray-700 text-center">അക്കൗണ്ട്സ് (Accounts)</button>
        </div>

        <!-- Section 1: New Estimate -->
        <div id="sectionNew" class="space-y-6">
            <!-- Customer Details Form -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">കസ്റ്റമർ വിവരങ്ങൾ</h2>
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-gray-600">പേര്:</label>
                        <input type="text" id="custName" class="w-full p-2 border rounded" placeholder="കസ്റ്റമറുടെ പേര്">
                    </div>
                    <div>
                        <label class="block text-gray-600">വീടിന്റെ പേര്:</label>
                        <input type="text" id="houseName" class="w-full p-2 border rounded" placeholder="വീടിന്റെ പേര്">
                    </div>
                    <div>
                        <label class="block text-gray-600">ഫോൺ / വാട്സാപ്പ് നമ്പർ:</label>
                        <input type="tel" id="custPhone" class="w-full p-2 border rounded" placeholder="10 അക്ക നമ്പർ">
                    </div>
                    <div>
                        <label class="block text-gray-600">സ്ഥലം:</label>
                        <input type="text" id="custLocation" class="w-full p-2 border rounded" placeholder="സ്ഥലം">
                    </div>
                    <div>
                        <label class="block text-gray-600">Care Of (ആരുടെയെങ്കിലും കീഴിലാണെങ്കിൽ):</label>
                        <input type="text" id="custCof" class="w-full p-2 border rounded" placeholder="C/O വല്ലവരുമുണ്ടെങ്കിൽ">
                    </div>
                </div>
            </div>

            <!-- Dynamic Items Selection -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">സാധനങ്ങളുടെ വിവരങ്ങൾ</h2>
                    <button onclick="addItemRow()" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm font-bold">+ പുതിയ സാധനം ചേർക്കുക</button>
                </div>
                
                <div id="itemsContainer" class="space-y-3">
                    <!-- Default Item Rows -->
                    <div class="item-row grid grid-cols-12 gap-2 items-center border-b pb-3">
                        <select class="item-name col-span-5 p-2 border rounded bg-white">
                            <option value="വാതിൽ (Door)">വാതിൽ (Door)</option>
                            <option value="ജനൽ (Window)">ജനൽ (Window)</option>
                            <option value="അലമാര (Almarah)">അലമാര (Almarah)</option>
                            <option value="ഗേറ്റ് (Gate)">ഗേറ്റ് (Gate)</option>
                            <option value="ഗ്രിൽ (Grill)">ഗ്രിൽ (Grill)</option>
                        </select>
                        <input type="number" placeholder="എണ്ണം" class="item-qty col-span-2 p-2 border rounded text-center" oninput="calculateTotal()">
                        <input type="number" placeholder="വില (₹)" class="item-price col-span-4 p-2 border rounded text-center" oninput="calculateTotal()">
                        <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
                    </div>
                </div>

                <!-- Total Calculation -->
                <div class="mt-6 p-4 bg-gray-50 rounded border">
                    <div class="flex justify-between text-lg font-bold">
                        <span>ആകെ തുക (Total):</span>
                        <span id="grandTotal">₹ 0</span>
                    </div>
                    <div class="mt-4">
                        <label class="block text-gray-600">അഡ്വാൻസ് നൽകിയ തുക:</label>
                        <input type="number" id="advanceAmt" placeholder="₹" class="w-full p-2 border rounded" oninput="calculateTotal()">
                    </div>
                    <div class="flex justify-between text-md font-semibold mt-2 text-red-600">
                        <span>ബാലൻസ് തുക:</span>
                        <span id="balanceAmt">₹ 0</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-3">
                <button onclick="saveAndSendWhatsApp()" class="bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 text-center">
                    ഡാറ്റ സേവ് ചെയ്ത് WhatsApp അയക്കുക (Mob & Name സഹിതം)
                </button>
            </div>
        </div>

        <!-- Section 2: Accounts / Search History -->
        <div id="sectionAcc" class="bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">കസ്റ്റമർ അക്കൗണ്ട്സ് തിരയുക</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="searchQuery" placeholder="പേരോ ഫോൺ നമ്പറോ നൽകുക" class="w-full p-2 border rounded">
                <button onclick="searchAccounts()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">സെർച്ച്</button>
            </div>
            <div id="searchResults" class="space-y-4">
                <!-- Search results will appear here -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBqTWN4ZtGgn0NW5MJiRxHFSL05gIPIgy4",
            authDomain: "thajfabrications.firebaseapp.com",
            projectId: "thajfabrications",
            storageBucket: "thajfabrications.firebasestorage.app",
            messagingSenderId: "660437727559",
            appId: "1:660437727559:web:e524fc879356e771fbf462",
            measurementId: "G-SS0Y0WTRZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchTab = function(tab) {
            if(tab === 'newEstimate') {
                document.getElementById('sectionNew').classList.remove('hidden');
                document.getElementById('sectionAcc').classList.add('hidden');
                document.getElementById('tabNew').className = "w-1/2 p-3 font-bold bg-blue-600 text-white text-center";
                document.getElementById('tabAcc').className = "w-1/2 p-3 font-bold bg-gray-200 text-gray-700 text-center";
            } else {
                document.getElementById('sectionNew').classList.add('hidden');
                document.getElementById('sectionAcc').classList.remove('hidden');
                document.getElementById('tabAcc').className = "w-1/2 p-3 font-bold bg-blue-600 text-white text-center";
                document.getElementById('tabNew').className = "w-1/2 p-3 font-bold bg-gray-200 text-gray-700 text-center";
            }
        }

        window.addItemRow = function() {
            let container = document.getElementById('itemsContainer');
            let row = document.createElement('div');
            row.className = "item-row grid grid-cols-12 gap-2 items-center border-b pb-3";
            row.innerHTML = `
                <select class="item-name col-span-5 p-2 border rounded bg-white">
                    <option value="വാതിൽ (Door)">വാതിൽ (Door)</option>
                    <option value="ജനൽ (Window)">ജനൽ (Window)</option>
                    <option value="അലമാര (Almarah)">അലമാര (Almarah)</option>
                    <option value="ഗേറ്റ് (Gate)">ഗേറ്റ് (Gate)</option>
                    <option value="ഗ്രിൽ (Grill)">ഗ്രിൽ (Grill)</option>
                </select>
                <input type="number" placeholder="എണ്ണം" class="item-qty col-span-2 p-2 border rounded text-center" oninput="calculateTotal()">
                <input type="number" placeholder="വില (₹)" class="item-price col-span-4 p-2 border rounded text-center" oninput="calculateTotal()">
                <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
            `;
            container.appendChild(row);
        }

        window.calculateTotal = function() {
            let rows = document.querySelectorAll('.item-row');
            let grandTotal = 0;
            rows.forEach(row => {
                let qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                let price = parseFloat(row.querySelector('.item-price').value) || 0;
                grandTotal += (qty * price);
            });

            document.getElementById('grandTotal').innerText = '₹ ' + grandTotal;
            let advance = parseFloat(document.getElementById('advanceAmt').value) || 0;
            let balance = grandTotal - advance;
            document.getElementById('balanceAmt').innerText = '₹ ' + balance;
        }

        window.saveAndSendWhatsApp = async function() {
            let name = document.getElementById('custName').value;
            let house = document.getElementById('houseName').value;
            let phone = document.getElementById('custPhone').value;
            let location = document.getElementById('custLocation').value;
            let cof = document.getElementById('custCof').value;
            
            let total = document.getElementById('grandTotal').innerText;
            let advance = document.getElementById('advanceAmt').value || 0;
            let balance = document.getElementById('balanceAmt').innerText;

            if(!name || !phone) {
                alert("ദയവായി കസ്റ്റമറുടെ പേരും ഫോൺ നമ്പറും നൽകുക!");
                return;
            }

            let itemsList = [];
            let rows = document.querySelectorAll('.item-row');
            rows.forEach(row => {
                let itemName = row.querySelector('.item-name').value;
                let qty = row.querySelector('.item-qty').value || 0;
                let price = row.querySelector('.item-price').value || 0;
                if(qty > 0) {
                    itemsList.push({ name: itemName, qty: qty, price: price });
                }
            });

            try {
                await addDoc(collection(db, "estimates"), {
                    customerName: name,
                    houseName: house,
                    phone: phone,
                    location: location,
                    careOf: cof,
                    items: itemsList,
                    totalAmount: total,
                    advanceAmount: advance,
                    balanceAmount: balance,
                    timestamp: new Date()
                });
            } catch (e) {
                console.error("Firebase Error: ", e);
                alert("ഡാറ്റ സേവ് ചെയ്യുന്നതിൽ തടസ്സമുണ്ടായി.");
                return;
            }

            // WhatsApp Message Format with Institution Name and Number
            let msg = `*താജ് ഫാബ്രിക്കേഷൻസ്, കാളികാവ്*\n`;
            msg += `*Mob: 9020322647*\n\n`;
            msg += `കസ്റ്റമർ: ${name} (${house})\n`;
            msg += `സ്ഥലം: ${location}\n\n`;
            msg += `*ഫാബ്രിക്കേഷൻ വിവരങ്ങൾ:*\n`;
            
            itemsList.forEach(item => {
                msg += `- ${item.name}: ${item.qty} എണ്ണം (വില: ₹${item.price} വീതം)\n`;
            });

            msg += `\nആകെ തുക: ${total}\n`;
            msg += `അഡ്വാൻസ്: ₹ ${advance}\n`;
            msg += `ബാലൻസ്: ${balance}\n\nനന്ദി!`;
            
            let encodedMsg = encodeURIComponent(msg);
            window.open(`https://wa.me/91${phone}?text=${encodedMsg}`, '_blank');

            // Clear Form Fields After Saving
            document.getElementById('custName').value = '';
            document.getElementById('houseName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custLocation').value = '';
            document.getElementById('custCof').value = '';
            document.getElementById('advanceAmt').value = '';
            document.getElementById('grandTotal').innerText = '₹ 0';
            document.getElementById('balanceAmt').innerText = '₹ 0';
            document.getElementById('itemsContainer').innerHTML = `
                <div class="item-row grid grid-cols-12 gap-2 items-center border-b pb-3">
                    <select class="item-name col-span-5 p-2 border rounded bg-white">
                        <option value="വാതിൽ (Door)">വാതിൽ (Door)</option>
                        <option value="ജനൽ (Window)">ജനൽ (Window)</option>
                        <option value="അലമാര (Almarah)">അലമാര (Almarah)</option>
                        <option value="ഗേറ്റ് (Gate)">ഗേറ്റ് (Gate)</option>
                        <option value="ഗ്രിൽ (Grill)">ഗ്രിൽ (Grill)</option>
                    </select>
                    <input type="number" placeholder="എണ്ണം" class="item-qty col-span-2 p-2 border rounded text-center" oninput="calculateTotal()">
                    <input type="number" placeholder="വില (₹)" class="item-price col-span-4 p-2 border rounded text-center" oninput="calculateTotal()">
                    <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
                </div>
            `;
        }

        window.searchAccounts = async function() {
            let queryText = document.getElementById('searchQuery').value.trim();
            let resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "പരതുന്നു...";

            if(!queryText) {
                resultsDiv.innerHTML = "ദയവായി പേരോ ഫോൺ നമ്പറോ നൽകുക.";
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "estimates"));
                let found = false;
                resultsDiv.innerHTML = "";

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    if(data.customerName.toLowerCase().includes(queryText.toLowerCase()) || data.phone.includes(queryText)) {
                        found = true;
                        let itemHtml = `<div class="p-4 border rounded bg-gray-50 shadow-sm">
                            <p><strong>പേര്:</strong> ${data.customerName} (${data.houseName})</p>
                            <p><strong>ഫോൺ:</strong> ${data.phone}</p>
                            <p><strong>സ്ഥലം:</strong> ${data.location}</p>
                            <p><strong>ആകെ തുക:</strong> ${data.totalAmount} | <strong>ബാലൻസ്:</strong> ${data.balanceAmount}</p>
                        </div>`;
                        resultsDiv.innerHTML += itemHtml;
                    }
                });

                if(!found) {
                    resultsDiv.innerHTML = "വിവരങ്ങൾ ഒന്നും കണ്ടെത്തിയില്ല.";
                }
            } catch (e) {
                console.error("Search error: ", e);
                resultsDiv.innerHTML = "സെർച്ച് ചെയ്യുന്നതിൽ തടസ്സമുണ്ടായി.";
            }
        }
    </script>
</body>
</html>
