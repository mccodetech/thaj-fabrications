<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaj Fabrications - Kalikavu | Estimate Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-3 max-w-md md:max-w-2xl">
        <!-- Header -->
        <div class="bg-blue-800 text-white p-4 rounded-lg shadow-md text-center mb-4">
            <h1 class="text-xl md:text-2xl font-bold">Thaj Fabrications, Kalikavu</h1>
            <p class="text-xs md:text-sm mt-1">Mob: 9020322647</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex mb-4 bg-white rounded-lg shadow overflow-hidden text-sm md:text-base">
            <button onclick="switchTab('newEstimate')" id="tabNew" class="w-1/3 p-2 md:p-3 font-bold bg-blue-600 text-white text-center">Estimate</button>
            <button onclick="switchTab('manageProducts')" id="tabProd" class="w-1/3 p-2 md:p-3 font-bold bg-gray-200 text-gray-700 text-center">Products</button>
            <button onclick="switchTab('accounts')" id="tabAcc" class="w-1/3 p-2 md:p-3 font-bold bg-gray-200 text-gray-700 text-center">Accounts</button>
        </div>

        <!-- Section 1: New Estimate -->
        <div id="sectionNew" class="space-y-4">
            <div class="bg-white p-4 md:p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">Customer Vivarangal</h2>
                <div class="grid grid-cols-1 gap-3 text-sm md:text-base">
                    <div>
                        <label class="block text-gray-600">Name:</label>
                        <input type="text" id="custName" class="w-full p-2 border rounded" placeholder="Customer's name">
                    </div>
                    <div>
                        <label class="block text-gray-600">House Name:</label>
                        <input type="text" id="houseName" class="w-full p-2 border rounded" placeholder="House name">
                    </div>
                    <div>
                        <label class="block text-gray-600">Phone / WhatsApp No:</label>
                        <input type="tel" id="custPhone" class="w-full p-2 border rounded" placeholder="10 digit number">
                    </div>
                    <div>
                        <label class="block text-gray-600">Location:</label>
                        <input type="text" id="custLocation" class="w-full p-2 border rounded" placeholder="Location">
                    </div>
                    <div>
                        <label class="block text-gray-600">Care Of (C/O):</label>
                        <input type="text" id="custCof" class="w-full p-2 border rounded" placeholder="C/O if any">
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 md:p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-gray-700">Products Selection</h2>
                    <button onclick="addItemRow()" class="bg-indigo-600 text-white px-3 py-1 rounded text-xs md:text-sm font-bold">+ Add Item</button>
                </div>
                
                <div id="itemsContainer" class="space-y-3">
                    <div class="item-row grid grid-cols-12 gap-1 md:gap-2 items-center border-b pb-3">
                        <select class="item-name col-span-5 p-2 border rounded bg-white text-xs md:text-sm"></select>
                        <input type="number" placeholder="Qty" class="item-qty col-span-2 p-2 border rounded text-center text-xs md:text-sm" oninput="calculateTotal()">
                        <input type="number" placeholder="Price" class="item-price col-span-4 p-2 border rounded text-center text-xs md:text-sm" oninput="calculateTotal()">
                        <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
                    </div>
                </div>

                <div class="mt-4 p-3 bg-gray-50 rounded border text-sm md:text-base">
                    <div class="flex justify-between font-bold">
                        <span>Grand Total:</span>
                        <span id="grandTotal">₹ 0</span>
                    </div>
                    <div class="mt-3">
                        <label class="block text-gray-600">Advance Amount:</label>
                        <input type="number" id="advanceAmt" placeholder="₹" class="w-full p-2 border rounded text-sm md:text-base" oninput="calculateTotal()">
                    </div>
                    <div class="flex justify-between font-semibold mt-2 text-red-600">
                        <span>Balance Amount:</span>
                        <span id="balanceAmt">₹ 0</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="saveAndSendWhatsApp()" class="bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 text-center text-sm md:text-base">
                    Save & Send WhatsApp Bill
                </button>
            </div>
        </div>

        <!-- Section 2: Manage Products Menu -->
        <div id="sectionProducts" class="bg-white p-4 md:p-6 rounded-lg shadow-md hidden space-y-4 text-sm md:text-base">
            <h2 class="text-lg font-semibold text-gray-700">Add New Product to Default Menu</h2>
            <div class="flex gap-2">
                <input type="text" id="newProductName" placeholder="Enter product name" class="w-full p-2 border rounded">
                <button onclick="addNewProduct()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">Add</button>
            </div>
            <h3 class="font-medium text-gray-600 mt-3">Current Products List:</h3>
            <ul id="productsListUI" class="list-disc pl-5 space-y-1 text-gray-700"></ul>
        </div>

        <!-- Section 3: Accounts / Search History -->
        <div id="sectionAcc" class="bg-white p-4 md:p-6 rounded-lg shadow-md hidden space-y-4 text-sm md:text-base">
            <h2 class="text-lg font-semibold text-gray-700">Search Customer Accounts</h2>
            <div class="flex gap-2">
                <input type="text" id="searchQuery" placeholder="Enter name or phone" class="w-full p-2 border rounded">
                <button onclick="searchAccounts()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">Search</button>
            </div>
            <div id="searchResults" class="space-y-3"></div>
        </div>

        <!-- Detailed Customer View Modal -->
        <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-3">
            <div class="bg-white rounded-lg p-4 md:p-6 max-w-lg w-full max-h-screen overflow-y-auto space-y-3" id="modalContent"></div>
        </div>
    </div>

    <!-- Firebase SDKs and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBqTWN4ZtGgn0NW5MJiRxHFSL05gIPIgy4",
            authDomain: "thajfabrications.firebaseapp.com",
            projectId: "thajfabrications",
            storageBucket: "thajfabrications.firebasestorage.app",
            messagingSenderId: "660437727559",
            appId: "1:660437727559:web:e524fc879356e771fbf462",
            measurementId: "G-SS0Y0WTRZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let defaultProducts = ["Door (വാതിൽ)", "Window (ജനൽ)", "Almarah (അലമാര)", "Gate (ഗേറ്റ്)", "Grill (ഗ്രിൽ)"];

        function loadProductsIntoSelects() {
            let selects = document.querySelectorAll('.item-name');
            selects.forEach(select => {
                let currentVal = select.value;
                select.innerHTML = "";
                defaultProducts.forEach(prod => {
                    let opt = document.createElement('option');
                    opt.value = prod;
                    opt.textContent = prod;
                    select.appendChild(opt);
                });
                if(currentVal) select.value = currentVal;
            });
        }

        window.loadProductManagementList = function() {
            let ul = document.getElementById('productsListUI');
            ul.innerHTML = "";
            defaultProducts.forEach(prod => {
                let li = document.createElement('li');
                li.textContent = prod;
                ul.appendChild(li);
            });
        }

        window.addNewProduct = function() {
            let prodName = document.getElementById('newProductName').value.trim();
            if(prodName) {
                if(!defaultProducts.includes(prodName)) {
                    defaultProducts.push(prodName);
                    document.getElementById('newProductName').value = "";
                    loadProductsIntoSelects();
                    loadProductManagementList();
                    alert("Product added successfully!");
                } else {
                    alert("Product already exists.");
                }
            } else {
                alert("Please enter a valid product name.");
            }
        }

        window.switchTab = function(tab) {
            document.getElementById('sectionNew').classList.add('hidden');
            document.getElementById('sectionProducts').classList.add('hidden');
            document.getElementById('sectionAcc').classList.add('hidden');

            document.getElementById('tabNew').className = "w-1/3 p-2 md:p-3 font-bold bg-gray-200 text-gray-700 text-center";
            document.getElementById('tabProd').className = "w-1/3 p-2 md:p-3 font-bold bg-gray-200 text-gray-700 text-center";
            document.getElementById('tabAcc').className = "w-1/3 p-2 md:p-3 font-bold bg-gray-200 text-gray-700 text-center";

            if(tab === 'newEstimate') {
                document.getElementById('sectionNew').classList.remove('hidden');
                document.getElementById('tabNew').className = "w-1/3 p-2 md:p-3 font-bold bg-blue-600 text-white text-center";
            } else if(tab === 'manageProducts') {
                document.getElementById('sectionProducts').classList.remove('hidden');
                document.getElementById('tabProd').className = "w-1/3 p-2 md:p-3 font-bold bg-blue-600 text-white text-center";
                loadProductManagementList();
            } else {
                document.getElementById('sectionAcc').classList.remove('hidden');
                document.getElementById('tabAcc').className = "w-1/3 p-2 md:p-3 font-bold bg-blue-600 text-white text-center";
            }
        }

        window.addItemRow = function() {
            let container = document.getElementById('itemsContainer');
            let row = document.createElement('div');
            row.className = "item-row grid grid-cols-12 gap-1 md:gap-2 items-center border-b pb-3";
            row.innerHTML = `
                <select class="item-name col-span-5 p-2 border rounded bg-white text-xs md:text-sm"></select>
                <input type="number" placeholder="Qty" class="item-qty col-span-2 p-2 border rounded text-center text-xs md:text-sm" oninput="calculateTotal()">
                <input type="number" placeholder="Price" class="item-price col-span-4 p-2 border rounded text-center text-xs md:text-sm" oninput="calculateTotal()">
                <button onclick="this.parentElement.remove(); calculateTotal();" class="col-span-1 text-red-600 font-bold text-center">X</button>
            `;
            container.appendChild(row);
            loadProductsIntoSelects();
        }

        window.calculateTotal = function() {
            let rows = document.querySelectorAll('.item-row');
            let grandTotal = 0;
            rows.forEach(row => {
                let qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                let price = parseFloat(row.querySelector('.item-price').value) || 0;
                grandTotal += (qty * price);
            });

            document.getElementById('grandTotal').innerText = '₹ ' + grandTotal;
            let advance = parseFloat(document.getElementById('advanceAmt').value) || 0;
            let balance = grandTotal - advance;
            document.getElementById('balanceAmt').innerText = '₹ ' + balance;
        }

        window.saveAndSendWhatsApp = async function() {
            let name = document.getElementById('custName').value;
            let house = document.getElementById('houseName').value;
            let phone = document.getElementById('custPhone').value;
            let location = document.getElementById('custLocation').value;
            let cof = document.getElementById('custCof').value;
            
            let total = document.getElementById('grandTotal').innerText;
            let advance = document.getElementById('advanceAmt').value || 0;
            let balance = document.getElementById('balanceAmt').innerText;

            if(!name || !phone) {
                alert("Please enter customer name and phone number!");
                return;
            }

            let itemsList = [];
            let rows = document.querySelectorAll('.item-row');
            rows.forEach(row => {
                let itemName = row.querySelector('.item-name').value;
                let qty = row.querySelector('.item-qty').value || 0;
                let price = row.querySelector('.item-price').value || 0;
                
                if(qty > 0) {
                    itemsList.push({ name: itemName, qty: qty, price: price });
                }
            });

            if(itemsList.length === 0) {
                alert("Please add at least one item!");
                return;
            }

            let dateStr = new Date().toLocaleString();

            try {
                await addDoc(collection(db, "estimates"), {
                    customerName: name,
                    houseName: house,
                    phone: phone,
                    location: location,
                    careOf: cof,
                    items: itemsList,
                    totalAmount: total,
                    advanceAmount: advance,
                    balanceAmount: balance,
                    date: dateStr
                });
            } catch (e) {
                console.error("Firebase Error: ", e);
                alert("Error saving data.");
                return;
            }

            let msg = `*Thaj Fabrications, Kalikavu*\n`;
            msg += `*Mob: 9020322647*\n\n`;
            msg += `Customer: ${name} (${house})\n`;
            msg += `Location: ${location}\n\n`;
            msg += `*Bill / Estimate Details:*\n`;
            
            itemsList.forEach(item => {
                msg += `- ${item.name}: ${item.qty} Nos (Price: ₹${item.price} each)\n`;
            });

            msg += `\nTotal Amount: ${total}\n`;
            msg += `Advance Paid: ₹ ${advance}\n`;
            msg += `Balance Amount: ${balance}\n\nThank you!`;
            
            let encodedMsg = encodeURIComponent(msg);
            window.open(`https://wa.me/91${phone}?text=${encodedMsg}`, '_blank');
        }

        window.searchAccounts = async function() {
            let queryText = document.getElementById('searchQuery').value.trim();
            let resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "Searching...";

            if(!queryText) {
                resultsDiv.innerHTML = "Please enter name or phone number.";
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "estimates"));
                let found = false;
                resultsDiv.innerHTML = "";

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    if(data.customerName.toLowerCase().includes(queryText.toLowerCase()) || data.phone.includes(queryText)) {
                        found = true;
                        let itemHtml = `<div class="p-3 border rounded bg-gray-50 shadow-sm cursor-pointer hover:bg-blue-50 text-sm" onclick='showCustomerDetail(${JSON.stringify(data)})'>
                            <p><strong>Name:</strong> ${data.customerName} (${data.houseName || ''})</p>
                            <p><strong>Phone:</strong> ${data.phone}</p>
                            <p><strong>Date:</strong> ${data.date || 'N/A'}</p>
                            <p class="text-blue-700 font-semibold mt-1">Total: ${data.totalAmount} | Balance: ${data.balanceAmount}</p>
                        </div>`;
                        resultsDiv.innerHTML += itemHtml;
                    }
                });

                if(!found) {
                    resultsDiv.innerHTML = "No records found.";
                }
            } catch (e) {
                console.error("Search error: ", e);
                resultsDiv.innerHTML = "Error during search.";
            }
        }

        window.showCustomerDetail = function(data) {
            let modal = document.getElementById('detailModal');
            let content = document.getElementById('modalContent');
            
            let itemsHtml = "";
            if(data.items) {
                data.items.forEach(it => {
                    itemsHtml += `<li class="flex justify-between border-b py-1 text-sm"><span>${it.name} (${it.qty} Nos x ₹${it.price})</span> <strong>₹${it.qty * it.price}</strong></li>`;
                });
            }

            content.innerHTML = `
                <div id="pdfInvoice" class="p-3 bg-white space-y-3">
                    <div class="text-center border-b pb-2">
                        <h2 class="text-lg font-bold text-blue-800">Thaj Fabrications, Kalikavu</h2>
                        <p class="text-xs text-gray-500">Mob: 9020322647</p>
                    </div>
                    <div class="text-xs md:text-sm">
                        <p><strong>Date:</strong> ${data.date || 'N/A'}</p>
                        <p><strong>Customer:</strong> ${data.customerName} (${data.houseName || ''})</p>
                        <p><strong>Phone:</strong> ${data.phone}</p>
                        <p><strong>Location:</strong> ${data.location || ''}</p>
                        ${data.careOf ? `<p><strong>C/O:</strong> ${data.careOf}</p>` : ''}
                    </div>
                    <div>
                        <h4 class="font-bold border-b pb-1 text-gray-700 text-sm">Items List:</h4>
                        <ul class="space-y-1">${itemsHtml}</ul>
                    </div>
                    <div class="bg-gray-50 p-2 rounded border space-y-1 text-xs md:text-sm">
                        <div class="flex justify-between font-bold"><span>Total:</span> <span>${data.totalAmount}</span></div>
                        <div class="flex justify-between"><span>Advance Paid:</span> <span>₹ ${data.advanceAmount || 0}</span></div>
                        <div class="flex justify-between font-semibold text-red-600"><span>Balance Amount:</span> <span>${data.balanceAmount}</span></div>
                    </div>
                </div>
                <div class="flex gap-2 pt-2 text-sm">
                    <button onclick="downloadPDF()" class="w-1/2 bg-blue-600 text-white py-2 rounded font-bold">Download PDF</button>
                    <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="w-1/2 bg-gray-400 text-white py-2 rounded font-bold">Close</button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        window.downloadPDF = function() {
            let element = document.getElementById('pdfInvoice');
            html2pdf().from(element).save('Thaj_Fabrications_Bill.pdf');
        }

        loadProductsIntoSelects();
    </script>
</body>
</html>
